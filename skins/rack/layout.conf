# MPC DJ FX 2 - native skin (browser-rendered artwork). Redesign 2026-10-27.
#
# Look: a PulyTek-style anodised graphite panel - engraved letterspaced caps, hairline bays, warm amber
# LEDs, one real cream-dial VU, big live values. Artwork is drawn by vst/art/make_djfx_skin.py (Pillow);
# MPC draws every name and value on top (vst/skin_post.py only sets the fonts), skin.css styles the
# controls. Nothing live is baked into the art.
#
# THREE pages replace the old DJ/REPEAT/DELAY/VERB/FLANGE/SETUP/EQ/MACROS set:
#   PERFORM  macros, DJ filter, master level/limiter, PANIC, VU + output readout
#   FX       beat repeat, delay, reverb, flanger, grain (the whole engine rack)
#   TONE     3-band isolator, crossovers, the 32-band curve display
#
# Coordinates are the framework's device space: SCREEN Y = cy - 86 (the plugin area is y 86..714).
#   screen 96..600 = content, 0..92 = masthead, 604..628 = footer rule.
#
# 2-state parameters (limiter, eq_on, dly_sync, dly_pingpong, verb_mode, fill_mode) are `toggle`
# lines and stay OFF every qlinks line: a 2-entry option list flips on any Q-Link event.
theme_bg=1f2429
theme_panel=16191d
theme_line=3f474e
theme_ink=d6cdb9
theme_ink_dim=f1e8d2
theme_ink_faint=8c9399
theme_accent=e5a841
theme_accent_hi=f7c76c
theme_knob_face=14181b
theme_knob_ring=0a0c0e
theme_knob_dot=f1e8d2
theme_lcd=0d0f11
theme_seg_active=e8dfc6
theme_seg_inactive=1d2227
theme_seg_active_tx=16191c
theme_display_ink=f1e8d2
theme_box=0b0d0f
knob_look=hardware
toggle_look=switch
seg_img=art/seg_off.png
seg_img_on=art/seg_on.png
art_css=skin.css
scale_names=1
label_scale=1.0

# ================================================================ PERFORM
[tab PERFORM]
art file=bg_perform.png fit=cover

# -- program level: the one real VU, and the live dBFS readout under it
meter   cx=212  cy=279  w=252 h=150 key=vu strip=art/vu_strip.png frames=81
readout cx=212  cy=396  w=252 h=46  label="OUT" key=out_show box=0 tsize=30 talign=center
text    cx=212  cy=190  label="PROGRAM LEVEL" size=0.95 color=8c9399 align=center spacing=2.6 case=upper
text    cx=574  cy=190  label="DJ FILTER" size=0.95 color=8c9399 align=center spacing=2.6 case=upper
text    cx=908  cy=190  label="MASTER" size=0.95 color=8c9399 align=center spacing=2.6 case=upper

# -- DJ filter (bi-polar: LP <- 0 -> HP), resonance
knob cx=468 cy=314 r=48 label="FILTER" key=dj_filter ns=21 vs=28 bw=150
knob cx=650 cy=314 r=32 label="RESO"   key=dj_reso   ns=19 vs=22 bw=140

# -- master: output trim and the macro-driven wet bus
knob cx=838 cy=314 r=42 label="OUTPUT" key=output_gain ns=20 vs=26 bw=150
readout cx=980 cy=314 w=150 h=42 label="MIX" key=mix_show box=0 tsize=22 tcolor=f2e6c8 talign=center

# -- panic / limiter
button cx=1155 cy=256 label="" key=panic img=art/panic_off.png img_on=art/panic_on.png w=170 h=80
toggle cx=1155 cy=364 label="LIMITER" key=limiter img=art/switch_off.png img_on=art/switch_on.png w=34 h=50

# -- interface switch (right of the limiter): copies TUI.json + the Q-Link banks, never an image
text   cx=1155 cy=424 label="INTERFACE" size=0.95 color=8c9399 align=center spacing=2.6 case=upper
enum_h cx=1155 cy=474 label="" key=ui sw=76 sh=24 rows=3

# -- macro morph: one hardware knob per gesture, the first Q-Link bank
knob cx=103  cy=577 r=38 label="GLITCH"    key=mac_glitch ns=20 vs=24
knob cx=255  cy=577 r=38 label="VERB"      key=mac_verb   ns=20 vs=24
knob cx=407  cy=577 r=38 label="FADE"      key=mac_fade   ns=20 vs=24
knob cx=559  cy=577 r=38 label="LPF"       key=mac_lpf    ns=20 vs=24
knob cx=711  cy=577 r=38 label="LOW-EQ"    key=mac_lo     ns=20 vs=24
knob cx=863  cy=577 r=38 label="MID-EQ"    key=mac_mid    ns=20 vs=24
knob cx=1015 cy=577 r=38 label="HI-EQ"     key=mac_hi     ns=20 vs=24
knob cx=1167 cy=577 r=38 label="AUTO-FILL" key=mac_fill   ns=20 vs=24
qlinks "PERFORM" = mac_glitch,mac_verb,mac_fade,mac_lpf,mac_lo,mac_mid,mac_hi,mac_fill,dj_filter,dj_reso,output_gain


# MPC DJ FX 2 - Shapey-style skin (browser artwork). Tabs: DJ FX / DJ FX 2 / SETUP.
#
# Composition, all three tabs: header strip (CURVE / MASTER / LIMITER / PANIC), one large plot panel
# (32 curve columns, meter rail with the live read-outs, 10 Hz magnitude response), then a row of FOUR
# parameter cards, 310 px wide (y 366..614 in art pixels). The plates, grid, captions and card frames are
# baked by vst/art/make_plate.py; vst/art/make_widgets.py draws the widget artwork (knob, curve column,
# VU, stage meters, PANIC); vst/skin.css restyles the controls the renderer draws.
#
# Coordinates are DEVICE pixels: the plugin area is y 86..714. The art (vst/bg_*.png, 1280x628) is the
# same page with y shifted by -86, so every cy here is the art y + 86 -- see vst/art/look.py (Y_OFF).
# An enum_h is CENTRED on its cy (seg_rects in shadow_skin.py); rows= stacks extra rows downwards.
# 2-state switches are enum_h and stay OFF the Q-Link lines (a 2-entry option list flips on any Q-Link
# event). One Q-Link set per tab, 16 slots = knob bank 1 (1-8) and bank 2 (9-16); the slot order of a
# qlinks line is the reading order of the page: card 1's four knobs left to right, then card 2, ...
#
# Card grid (art -> device is +86; these cx values are device x, cards are 8 px apart from x=8):
#   card 1 x  8..318  knobs 61, 129, 197, 265
#   card 2 x 326..636 knobs 379, 447, 515, 583
#   card 3 x 644..954 knobs 697, 765, 833, 901
#   card 4 x 962..1272 knobs 1015, 1083, 1151, 1219
theme_bg=0a0c0f
theme_panel=13171c
theme_line=2b323b
theme_ink=e9ecf0
theme_ink_dim=8f98a2
theme_ink_faint=5c646e
theme_accent=e0a33a
theme_accent_hi=e8b45a
theme_knob_face=22262c
theme_knob_ring=2e343c
theme_knob_dot=e0a33a
theme_lcd=0b0e11
theme_seg_active=e0a33a
theme_seg_inactive=1d2228
theme_seg_active_tx=15181c
theme_box=0b0e11
theme_btn_bg=2a1216
theme_btn_on=e0a33a
theme_btn_text=f2c9cc
knob_strip=art/knob_strip.png
knob_frames=127
art_css=skin.css


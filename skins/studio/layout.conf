# cards 3 and 4 are deliberately empty: nothing is placed on them, the plate carries a "RESERVED" note
# so the free room reads as intentional. A later idea takes one of them without moving the macros.
# Q-Link 1-4 = MACRO FX (GLITCH, VERB, FADE, LPF), 5-8 = MACRO TONE (LOW-EQ, MID-EQ, HI-EQ, AUTO-FILL),
# 9 = MASTER (header; continuous, so not left touch-only while slots are free), 10 = DELAY DIV (the
# 12-way selector on this tab's rail -- stepping it from a knob is the only physical reach here).
# Slots 11-16 stay empty: the tab has no other continuous control.
qlinks "MACROS" = mac_glitch,mac_verb,mac_fade,mac_lpf,mac_lo,mac_mid,mac_hi,mac_fill,output_gain,dly_div


# MPC DJ FX 2 - native skin (HTML artwork). Pages: DJ / REPEAT / DELAY / VERB / FLANGE+GRAIN / SETUP.
# Built by the framework tooling (gen_vst + shadow_skin + html_art); render every page with
#   vst/preview.sh   -> docs/ui-preview/page_*.png
# Look: ivory chassis + ink header (Magic Tape Echo) with Ableton-flat controls. The per-page artwork
# (vst/art/make_faceplate.py -> bg_<page>.png) carries the masthead and the section frames; MPC draws the
# live names/values on top, skin.css styles the value plates and the segments.
# 2-state switches are enum_h and stay OFF the Q-Links (a 2-entry option list flips on any Q-Link event).
theme_bg=efe8d8
theme_panel=efe9da
theme_line=bcb3a0
theme_ink=1e2a26
theme_ink_dim=3a4a44
theme_ink_faint=8a8574
theme_accent=1f7a3d
theme_accent_hi=d9531e
theme_knob_face=1e2a26
theme_knob_ring=121a17
theme_knob_dot=efe9da
theme_lcd=1e2a26
theme_seg_active=1f7a3d
theme_seg_inactive=e2dbc9
theme_seg_active_tx=f6f2e6
toggle_look=led
art_css=skin.css
scale_names=1
label_scale=1.2

# ---------------------------------------------------------------- Page 1 - MACROS
[tab MACROS]
art file=bg_macros.png fit=cover
# Owner decision 2026-10-26: the macro row moved to the top (Q-Links follow it), the EQ row down;
# AUTO-FILL and LPF keep their corner. Row y = 300 / 505 so the live value plate still fits the 628 px area.
knob cx=180  cy=300 r=46 label="GLITCH"  key=mac_glitch
knob cx=480  cy=300 r=46 label="VERB"    key=mac_verb
knob cx=780  cy=300 r=46 label="FADE"    key=mac_fade
knob cx=1080 cy=300 r=46 label="LPF"     key=mac_lpf
knob cx=180  cy=505 r=46 label="LOW-EQ"  key=mac_lo
knob cx=480  cy=505 r=46 label="MID-EQ"  key=mac_mid
knob cx=780  cy=505 r=46 label="HI-EQ"   key=mac_hi
knob cx=1080 cy=505 r=46 label="AUTO-FILL" key=mac_fill
qlinks "MACROS" = mac_glitch,mac_verb,mac_fade,mac_lpf,mac_lo,mac_mid,mac_hi,mac_fill

# ---------------------------------------------------------------- Page 1 - DJ
[tab DJ]
art file=bg_dj.png fit=cover
meter cx=1048 cy=580 w=304 h=40 key=vu strip=art/vu_strip.png frames=81
readout cx=1048 cy=628 w=304 h=30 label="-" key=out_show box=0 tsize=22 tcolor=efe9da talign=center
knob cx=160  cy=300 r=46 label="FILTER" key=dj_filter
knob cx=400  cy=300 r=46 label="RESO"   key=dj_reso
knob cx=640  cy=300 r=46 label="LOW"    key=iso_lo
knob cx=880  cy=300 r=46 label="MID"    key=iso_mid
button cx=1120 cy=300 label="PANIC" key=panic
knob cx=160  cy=505 r=46 label="HI"     key=iso_hi
knob cx=400  cy=505 r=52 label="MIX"    key=mix
knob cx=640  cy=505 r=52 label="OUTPUT" key=output_gain
qlinks "DJ" = dj_filter,dj_reso,iso_lo,iso_mid,iso_hi,mix,output_gain

# ---------------------------------------------------------------- Page 2 - REPEAT
[tab REPEAT]
art file=bg_repeat.png fit=cover
enum_h cx=640 cy=310 label="GRID" key=rep_mode sw=72 rows=2
enum_h cx=1050 cy=310 label="MODE" key=fill_mode sw=110 rows=2
knob cx=200 cy=520 r=46 label="GATE"    key=rep_gate
knob cx=440 cy=520 r=46 label="CHANCE"  key=rep_chance
knob cx=680 cy=520 r=46 label="REPEATS" key=rep_count
knob cx=920 cy=520 r=46 label="GLITCH"  key=rep_mix
meter cx=1080 cy=560 w=240 h=26 key=rep_act strip=art/met_strip.png frames=41
qlinks "REPEAT" = rep_mode,rep_gate,rep_chance,rep_count,rep_mix

# ---------------------------------------------------------------- Page 3 - DELAY
[tab DELAY]
